# Adapted from Skrubba's workflow. Two levels:
#
#   checks   every push to main and every pull request: type check and unit tests, the parity tests against
#            the real model included. A few minutes.
#   browser  the full Playwright suite in Chromium against a production build. Runs for release tags (v*) and
#            when started by hand (Actions → Tests → Run workflow), to save Actions minutes while the repo is
#            private. Run `npm run e2e` locally before relying on it.
#
# Pushes that only touch Markdown or docs/ run nothing. The pinned model and Playwright's browser are cached,
# so a normal run downloads neither. Deploys are Cloudflare Pages' job (docs/DEPLOY.md), not this workflow's.
name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The model files, sha256-checked by scripts/fetch-model.mjs. The key follows the pinned revision in src/config.ts.
      - uses: actions/cache@v6
        with:
          path: .cache/model
          key: model-${{ hashFiles('src/config.ts') }}

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (fetches the model if not cached)
        run: npm test

  browser:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: .cache/model
          key: model-${{ hashFiles('src/config.ts') }}

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the test browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the test browser's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser tests (Chromium)
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
