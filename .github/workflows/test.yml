# Adapted from Skrubba's workflow. Three levels:
#
#   checks   every push to dev or main and every pull request: type check and unit tests, the parity tests against
#            the real model included. A few minutes.
#   browser  the full Playwright suite in Chromium, Firefox and WebKit against a production build. Runs for every push
#            to dev (the test branch, see docs/DEPLOY.md), for release tags (v*) and when started by hand
#            (Actions → Tests → Run workflow).
#   release  for a v* tag, once both have passed: the GitHub release page, with that version's notes from CHANGELOG.md.
#
# Pushes that only touch Markdown or docs/ run nothing. The pinned model and Playwright's browser are cached,
# so a normal run downloads neither. Deploys are Cloudflare Pages' job (docs/DEPLOY.md), not this workflow's.
name: Tests

on:
  push:
    branches: [dev, main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # The model files, sha256-checked by scripts/fetch-model.mjs. The key follows the pinned revision in src/config.ts.
      - uses: actions/cache@v6
        with:
          path: .cache/model
          key: model-${{ hashFiles('src/config.ts') }}

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (fetches the model if not cached)
        run: npm test

  browser:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: .cache/model
          key: model-${{ hashFiles('src/config.ts') }}

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-3-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the test browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install the test browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      - name: Browser tests (Chromium, Firefox, WebKit)
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Plain Node runs the TypeScript script; nothing to install.
      - name: Release page from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.ts "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Norn ${GITHUB_REF_NAME#v}" --notes-file notes.md
